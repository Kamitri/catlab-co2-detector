[package]
name = "co2-monitor"
version = "1.0.4"
description = "Data acquisition for CO2 NDIR detector"
authors = ["Nguyễn Minh Trí <tri@kamitri.com>"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "co2_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.101"
chrono = { version = "0.4", features = ["serde"] }
keepawake = "0.6"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
